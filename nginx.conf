server {
    listen 80;
    server_name localhost;

    # Rota principal para servir o build estático do React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redireciona qualquer requisição interna para o index.html (fallback para SPA)
        try_files $uri $uri/ /index.html;
    }

    # Página padrão de erro do Nginx (50x)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}